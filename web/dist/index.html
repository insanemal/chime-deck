<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ChimeDeck</title>
    <script>
      // Pre-paint theme and UI scale: apply the stored choices before first
      // paint so there is no flash of the wrong palette, or of an unscaled
      // panel. A denied or throwing localStorage must be swallowed — the markup
      // default (data-theme="dark", no data-ui-scale) then applies.
      (function () {
        try {
          var stored = localStorage.getItem('doorbell.theme');
          if (
            stored === 'light' ||
            (stored === 'auto' &&
              window.matchMedia('(prefers-color-scheme: light)').matches)
          ) {
            document.documentElement.dataset.theme = 'light';
          }

          // Same pre-paint cache as the theme, for `ui.scale` (HSD-nlbf). Only a
          // stored, off-step-100 value writes anything: 100% is the base size
          // and needs no attribute, and an absent or unknown value must not
          // leave one behind (it would be re-read next load).
          var scale = localStorage.getItem('doorbell.scale');
          if (
            scale === '85' ||
            scale === '100' ||
            scale === '115' ||
            scale === '130' ||
            scale === '150'
          ) {
            if (scale !== '100') document.documentElement.dataset.uiScale = scale;
          }
        } catch (err) {
          /* leave data-theme="dark" and no data-ui-scale */
        }
      })();
    </script>
